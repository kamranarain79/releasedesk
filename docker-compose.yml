services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: releasedesk
      POSTGRES_PASSWORD: releasedesk
      POSTGRES_DB: releasedesk
    ports:
      - "5432:5432"
    volumes:
      - releasedesk-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U releasedesk -d releasedesk"]
      interval: 2s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  releasedesk:
    build:
      context: .
      dockerfile: Dockerfile
    image: releasedesk:1.0.0
    container_name: releasedesk
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
      - "9090:9090"
    environment:
      RELEASEDESK_DATA_DIR: /app/_data
      RELEASEDESK_PORTAL_URL: http://localhost:9090
      RELEASEDESK_DATABASE_URL: postgres://releasedesk:releasedesk@postgres:5432/releasedesk?sslmode=disable
    volumes:
      - releasedesk-data:/app/_data
    restart: unless-stopped

volumes:
  releasedesk-data:
  releasedesk-pg:
