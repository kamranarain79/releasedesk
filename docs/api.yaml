openapi: 3.1.0
info:
  title: ReleaseDesk API
  version: 1.0.0
  description: |
    Per-app CI token (`Authorization: Bearer`, `X-Auth`, or HTTP Basic password).
    A token for one app cannot read another app (404). An instance token is generated on first start (Administration) and can read every app.
    Query `?token=` is accepted but should not be used (it leaks in proxy logs).
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
paths:
  /health:
    get:
      security: []
      summary: Shallow health check
      responses:
        '200':
          description: ok
  /api/v1/apps:
    get:
      summary: Apps this token can access
      responses:
        '200':
          description: Application list
  /api/v1/apps/{slug}/releases:
    post:
      summary: Create a release (CI)
      parameters:
        - $ref: '#/components/parameters/slug'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: {type: string}
                channel: {type: string, description: Channel name such as Stable}
      responses:
        '201':
          description: Created
        '409':
          description: Version already exists
  /api/v1/apps/{slug}/releases/{version}:
    get:
      summary: Notes, QA methods, and files
      parameters:
        - $ref: '#/components/parameters/slug'
        - $ref: '#/components/parameters/version'
      responses:
        '200':
          description: Bundle JSON
  /api/v1/apps/{slug}/releases/{version}/files:
    get:
      summary: Filebrowser-style listing
      parameters:
        - $ref: '#/components/parameters/slug'
        - $ref: '#/components/parameters/version'
      responses:
        '200':
          description: items[]
  /api/v1/apps/{slug}/releases/{version}/files/{name}:
    get:
      summary: Download one file by name
      parameters:
        - $ref: '#/components/parameters/slug'
        - $ref: '#/components/parameters/version'
        - in: path
          name: name
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Octet stream
  /api/v1/apps/{slug}/releases/{version}/bundle.zip:
    get:
      summary: Zip of the release files plus sha256sums.txt
      parameters:
        - $ref: '#/components/parameters/slug'
        - $ref: '#/components/parameters/version'
      responses:
        '200':
          description: application/zip
  /api/v1/apps/{slug}/releases/{version}/notes:
    get:
      summary: Release notes
      parameters:
        - $ref: '#/components/parameters/slug'
        - $ref: '#/components/parameters/version'
      responses:
        '200':
          description: Notes
    put:
      summary: Replace release notes
      parameters:
        - $ref: '#/components/parameters/slug'
        - $ref: '#/components/parameters/version'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                text: {type: string}
                changelogs:
                  type: array
                  items:
                    type: object
                    properties:
                      text: {type: string}
                      changeType: {type: string}
      responses:
        '200':
          description: Saved
  /api/v1/apps/{slug}/releases/{version}/test-methods:
    get:
      summary: QA test plan
      parameters:
        - $ref: '#/components/parameters/slug'
        - $ref: '#/components/parameters/version'
      responses:
        '200':
          description: Plan
    put:
      summary: Replace QA test plan
      parameters:
        - $ref: '#/components/parameters/slug'
        - $ref: '#/components/parameters/version'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                overview: {type: string}
                methods:
                  type: array
                  items:
                    type: object
                    properties:
                      title: {type: string}
                      steps: {type: string}
                      expectedResult: {type: string}
      responses:
        '200':
          description: Saved
  /api/v1/apps/{slug}/channels/{channel}/latest:
    get:
      summary: Redirect to the latest release on a channel
      parameters:
        - $ref: '#/components/parameters/slug'
        - in: path
          name: channel
          required: true
          schema: {type: string}
      responses:
        '307':
          description: Redirect
  /api/v1/apps/{slug}/feed.json:
    get:
      summary: Latest build per platform
      parameters:
        - $ref: '#/components/parameters/slug'
      responses:
        '200':
          description: Feed
  /api/v1/files/{checksum}:
    get:
      summary: Download by SHA-256
      parameters:
        - in: path
          name: checksum
          required: true
          schema: {type: string, pattern: '^[0-9a-fA-F]{64}$'}
      responses:
        '200':
          description: Octet stream
        '400':
          description: Checksum is not 64 hex characters
  /api/apps/{slug}/platforms/{platform}/builds:
    post:
      summary: Upload firmware or application artifacts
      parameters:
        - $ref: '#/components/parameters/slug'
        - in: path
          name: platform
          required: true
          schema: {type: string, example: ESP32}
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [Number, Version]
              properties:
                Number: {type: string}
                Version: {type: string}
                Sha256: {type: string, description: Required match when exactly one file is uploaded}
                overwrite: {type: string, enum: ['true', 'false']}
                File_firmware: {type: string, format: binary}
                File_bootloader: {type: string, format: binary}
                File_partition: {type: string, format: binary}
                File_application: {type: string, format: binary}
                File_hex: {type: string, format: binary}
                File_rauc: {type: string, format: binary}
                File: {type: string, format: binary}
      responses:
        '201':
          description: JSON build with artifacts
        '409':
          description: Build number exists and overwrite is not true
  /api/v1/apps/{slug}/members:
    get:
      summary: List app members (console session)
      description: Requires a console login for an app admin or instance admin. Not a CI token.
      parameters:
        - $ref: '#/components/parameters/slug'
      responses:
        '200':
          description: Members
    put:
      summary: Add or remove a member
      parameters:
        - $ref: '#/components/parameters/slug'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId: {type: integer}
                role: {type: string, enum: [admin, user]}
                remove: {type: boolean}
      responses:
        '200':
          description: Updated
  /api/v1/apps/{slug}/tokens:
    post:
      summary: Mint a per-app CI token (shown once)
      parameters:
        - $ref: '#/components/parameters/slug'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {type: string}
                scope: {type: string, enum: [read, write], description: read allows GET only. write can create releases and upload builds. Defaults to write.}
      responses:
        '201':
          description: Raw token
  /api/v1/apps/{slug}/settings:
    put:
      summary: Update description, visibility, and Teams webhook
      parameters:
        - $ref: '#/components/parameters/slug'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                description: {type: string}
                private: {type: boolean}
                teamsWebhookUrl: {type: string, description: https URL on outlook.office.com or webhook.office.com. Empty keeps the current URL.}
                clearWebhook: {type: boolean}
      responses:
        '200':
          description: Saved. The full webhook URL is not returned.
        '400':
          description: Rejected URL (including http and private hosts)
  /api/v1/apps/{slug}/webhooks/test:
    post:
      summary: Send a sample Teams card
      parameters:
        - $ref: '#/components/parameters/slug'
      responses:
        '200':
          description: Teams accepted the card
        '502':
          description: Teams did not accept the card
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    slug:
      in: path
      name: slug
      required: true
      schema: {type: string}
    version:
      in: path
      name: version
      required: true
      schema: {type: string}
x-planned:
  - Sparkle and Squirrel feeds
  - Portal tester login
  - Store connections
  - Per-file firmware encryption and HSM signing
